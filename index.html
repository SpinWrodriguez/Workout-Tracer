<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <title>Workout Tracer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * Applies the stored theme before first paint. Without this the app
       * always renders dark for a frame and then flips, which is the most
       * visible bug a theme switcher can have. Kept inline and dependency-free
       * so it runs before the bundle is even requested.
       */
      (function () {
        try {
          var stored = localStorage.getItem('workout-theme') || 'system';
          var light =
            stored === 'light' ||
            (stored === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F2F2F5');
          }
        } catch (e) {
          /* Blocked storage falls through to the dark default. */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
